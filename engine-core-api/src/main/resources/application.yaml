spring:
  application:
    name: batch-engine-job-api

  web:
    cors:
      mappings:
        "[/**]":
          allowed-origins: "*"
          allowed-methods: "*"
          allowed-headers: "*"
  datasource:
    url: jdbc:postgresql://localhost:5432/batch_engine
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: 8082

# URL del core — sobreescribir en producción con variable de entorno
batch:
  engine:
    core:
      url: ${CORE_URL:http://localhost:8083}

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 60000  # 60s — los jobs pueden tardar

logging:
  level:
    com.xanxs: DEBUG
    feign: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true