<div class="page">

  <div class="page-header">

    <div>

      <h1>Nuevo Template</h1>

      <p>
        Configura un nuevo template de procesamiento.
      </p>

    </div>

  </div>

  <mat-card class="error-card" *ngIf="errorMessage">
    <mat-card-content>
      {{ errorMessage }}
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="save()">

        <div class="form-grid">

          <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>

            <input matInput formControlName="name" maxlength="100">

            <mat-error *ngIf="form.controls.name.hasError('required')">
              El nombre es obligatorio.
            </mat-error>

            <mat-error *ngIf="form.controls.name.hasError('maxlength')">
              Máximo 100 caracteres.
            </mat-error>

          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descripción</mat-label>

            <textarea matInput formControlName="description" rows="3" maxlength="500"></textarea>

            <mat-error *ngIf="form.controls.description.hasError('maxlength')">
              Máximo 500 caracteres.
            </mat-error>

          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Tipo de archivo</mat-label>
            <select matNativeControl formControlName="fileType">
              <option *ngFor="let type of fileTypes" [value]="type">{{ type }}</option>
            </select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Separador</mat-label>
            <input matInput formControlName="separator">
            <mat-hint>Ejemplo: ,</mat-hint>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Encoding</mat-label>
            <input matInput formControlName="encoding">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Comportamiento ante error</mat-label>
            <select matNativeControl formControlName="onError">
              <option *ngFor="let behavior of errorBehaviors" [value]="behavior">{{ behavior }}</option>
            </select>
          </mat-form-field>

        </div>

        <div class="options">
          <mat-checkbox formControlName="skipEmptyLines">Omitir líneas vacías</mat-checkbox>
          <mat-checkbox formControlName="active">Template activo</mat-checkbox>
        </div>

        <div class="actions">
          <button type="button" mat-button (click)="cancel()" [disabled]="saving">Cancelar</button>

          <button type="submit" mat-flat-button color="primary" [disabled]="saving">
            <mat-spinner *ngIf="saving" diameter="20"></mat-spinner>
            <span *ngIf="!saving">Guardar</span>
          </button>

        </div>

      </form>

    </mat-card-content>
  </mat-card>

</div>
