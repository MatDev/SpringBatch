<div class="page">

  <div class="page-header">

    <div>

      <h1>Templates</h1>

      <p>
        Administración de configuraciones de procesamiento.
      </p>

    </div>

    <button
      mat-flat-button
      color="primary"
      routerLink="/templates/new">

      <mat-icon>add</mat-icon>

      Nuevo Template

    </button>

  </div>


  <mat-card class="error-card" *ngIf="errorMessage">
    <mat-card-content>
      {{ errorMessage }}
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-content>

      <ng-container *ngIf="loading; else listContent">
        <div class="loading">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      </ng-container>

      <ng-template #listContent>
        <div class="table-container">

          <table
            mat-table
            [dataSource]="templates">

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Nombre</th>
              <td mat-cell *matCellDef="let template">{{ template.name }}</td>
            </ng-container>

            <ng-container matColumnDef="fileType">
              <th mat-header-cell *matHeaderCellDef>Tipo</th>
              <td mat-cell *matCellDef="let template">{{ template.fileType }}</td>
            </ng-container>

            <ng-container matColumnDef="encoding">
              <th mat-header-cell *matHeaderCellDef>Encoding</th>
              <td mat-cell *matCellDef="let template">{{ template.encoding }}</td>
            </ng-container>

            <ng-container matColumnDef="active">
              <th mat-header-cell *matHeaderCellDef>Estado</th>
              <td mat-cell *matCellDef="let template">
                <span *ngIf="template.active" class="status active">Activo</span>
                <span *ngIf="!template.active" class="status inactive">Inactivo</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let template">
                <button mat-icon-button matTooltip="Ver">
                  <mat-icon>visibility</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Editar">
                  <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button matTooltip="Eliminar">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          </table>

          <div class="empty" *ngIf="templates.length === 0">
            <mat-icon>inventory_2</mat-icon>
            <p>No existen templates configurados.</p>
          </div>

        </div>
      </ng-template>

    </mat-card-content>
  </mat-card>

</div>
